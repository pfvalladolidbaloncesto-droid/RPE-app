<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cambiar contraseña · RVB Jugadores</title>
  <script src="auth_jugadores_api.js?v=1"></script>
  <script src="sesion_guard_jugador.js?v=1"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .cambio-card{max-width:470px;width:calc(100% - 28px);margin:35px auto;padding:25px 22px;
      background:#fff;border-radius:12px;box-shadow:0 5px 17px #0001;box-sizing:border-box}
    .cambio-card h1{font-size:1.4rem;margin-top:0;text-align:center}
    .cambio-card label{display:block;margin:15px 0 5px;font-weight:600}
    .cambio-card input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #c9d1d9;border-radius:7px;font-size:16px}
    .cambio-card input[readonly]{background:#f1f4f7}
    .cambio-acciones{display:flex;gap:10px;margin-top:18px}
    .cambio-acciones button{flex:1;min-height:44px;border-radius:7px}
    #estadoCambio{font-size:14px;line-height:1.5;white-space:pre-wrap}
    #estadoCambio.error{color:#b42318}#estadoCambio.exito{color:#0c7a4a}
    @media(max-width:480px){.cambio-acciones{flex-direction:column}}
  </style>
</head>
<body>
<main class="cambio-card">
  <h1>Cambiar contraseña</h1>
  <form id="formCambiarContrasena">
    <label for="usuarioConectado">Usuario conectado</label>
    <input id="usuarioConectado" type="text" readonly>
    <label for="passwordActual">Contraseña actual</label>
    <input id="passwordActual" type="password" autocomplete="current-password" required>
    <label for="passwordNueva">Contraseña nueva (mínimo 8 caracteres)</label>
    <input id="passwordNueva" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <label for="passwordConfirmar">Confirmar contraseña nueva</label>
    <input id="passwordConfirmar" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
    <div class="cambio-acciones">
      <button id="btnGuardarContrasena" type="submit">Guardar contraseña</button>
      <button id="btnVolverMenu" type="button" class="btn-secondary">Menú</button>
    </div>
    <p id="estadoCambio" role="status" aria-live="polite"></p>
  </form>
</main>
<script src="cambiar_contrasena_jugador.js?v=1" defer></script>
</body>
</html>
